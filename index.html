

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23800020'/><text x='50' y='50' font-size='60' text-anchor='middle' dominant-baseline='middle'>❤️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #4A0E0E 0%, #6B1423 25%, #800020 50%, #6B1423 75%, #4A0E0E 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            opacity: 0;
            animation: floatUp 15s infinite ease-in-out;
            filter: drop-shadow(0 0 10px rgba(255, 182, 193, 0.8));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-150px) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .floating-heart:nth-child(1) { left: 15%; font-size: 40px; animation-delay: 0s; }
        .floating-heart:nth-child(2) { left: 35%; font-size: 55px; animation-delay: 3s; }
        .floating-heart:nth-child(3) { left: 55%; font-size: 45px; animation-delay: 6s; }
        .floating-heart:nth-child(4) { left: 75%; font-size: 50px; animation-delay: 9s; }
        .floating-heart:nth-child(5) { left: 90%; font-size: 42px; animation-delay: 2s; }
        .floating-heart:nth-child(6) { left: 25%; font-size: 48px; animation-delay: 12s; }

        .login-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 900px;
            width: 100%;
        }

        .heart-container {
            position: relative;
            width: 650px;
            height: 600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .big-heart {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 550px;
            color: transparent;
            animation: heartBeat 2s infinite;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.9)) 
                    drop-shadow(0 15px 35px rgba(0, 0, 0, 0.8))
                    drop-shadow(0 25px 50px rgba(0, 0, 0, 0.6));
            will-change: transform;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        .big-heart::before {
            content: "❤️";
            background: linear-gradient(135deg, 
                #C41E3A 0%,      /* أحمر أهدى من فوق */
                #B91C30 25%,     /* أحمر غامق شوية */
                #A01828 50%,     /* أحمر داكن في النص */
                #B91C30 75%,     /* أحمر غامق */
                #C41E3A 100%);   /* أحمر أهدى من تحت */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.7))
                    drop-shadow(0 0 20px rgba(180, 30, 50, 0.5));
        }

        @keyframes heartBeat {
            0%, 100% { transform: translateZ(0) scale(1); }
            10%, 30% { transform: translateZ(0) scale(1.06); }
            20%, 40% { transform: translateZ(0) scale(1); }
        }

        .login-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            z-index: 2;
            padding: 40px 30px;
        }

        .login-icon {
            text-align: center;
            margin-bottom: 20px;
            font-size: 50px;
            animation: iconFloat 3s infinite ease-in-out;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-title {
            text-align: center;
            font-size: 2.2em;
            color: #FFE5EC;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 182, 193, 0.6);
        }

        .login-subtitle {
            text-align: center;
            font-size: 1.1em;
            color: #FFD1DC;
            margin-bottom: 30px;
            font-weight: 400;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #FFE5EC;
            font-size: 1em;
            font-weight: 600;
            text-align: right;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 3px solid rgba(255, 182, 193, 0.4);
            border-radius: 15px;
            font-size: 1em;
            font-family: 'Tajawal', sans-serif;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            color: #FFE5EC;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .input-group input:focus {
            outline: none;
            border-color: #FFB6C1;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 5px 20px rgba(255, 182, 193, 0.5);
            transform: translateY(-2px);
        }

        .input-group input::placeholder {
            color: #FFD1DC;
            opacity: 0.8;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #800020, #6B1423, #4A0E0E);
            border: none;
            border-radius: 15px;
            color: #FFE5EC;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 182, 193, 0.3);
            transition: all 0.4s ease;
            margin-top: 10px;
            border: 3px solid rgba(255, 182, 193, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 182, 193, 0.6);
            background: linear-gradient(135deg, #6B1423, #800020, #6B1423);
        }

        .login-btn:active {
            transform: translateY(-2px);
        }

        .extra-message {
            text-align: center;
            margin-top: 20px;
            color: #FFD1DC;
            font-size: 0.9em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            .heart-container {
                width: 400px;
                height: 400px;
            }

            .big-heart {
                font-size: 350px;
                animation: none;
                transform: translateZ(0) scale(1);
            }

            .login-content {
                width: 75%;
                padding: 20px;
            }

            .login-icon {
                font-size: 40px;
                margin-bottom: 15px;
            }

            .login-title {
                font-size: 1.6em;
            }

            .login-subtitle {
                font-size: 0.95em;
                margin-bottom: 20px;
            }

            .input-group {
                margin-bottom: 15px;
            }

            .input-group label {
                font-size: 0.9em;
            }

            .input-group input {
                padding: 12px 15px;
                font-size: 0.95em;
            }

            .login-btn {
                padding: 14px;
                font-size: 1.1em;
            }

            .floating-heart {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .heart-container {
                width: 320px;
                height: 320px;
            }

            .big-heart {
                font-size: 280px;
            }

            .login-content {
                width: 80%;
            }

            .login-title {
                font-size: 1.4em;
            }

            .login-subtitle {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-container">
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">❤️</div>
      
    </div>

    <div class="login-container">
        <div class="heart-container">
            <div class="big-heart"></div>
            <div class="login-content">
                <div class="login-icon">💖</div>
                
                <h1 class="login-title">Enter Password</h1>
                <p class="login-subtitle">💕Our Love Story💕</p>

               <form onsubmit="checkPassword(event)">
    <div class="input-group">
        <label for="text">Password</label>
        <input type="text" id="password" name="password" placeholder="password" required>
    </div>

    <button type="submit" class="login-btn">
        💕Unlock my heart💕
    </button>
</form>

                <div class="extra-message">
                    <p>💖</p>
                </div>
            </div>
        </div>
    </div>

    <script>
          function checkPassword(event) {
        event.preventDefault(); // منع إرسال الفورم
        
        const password = document.getElementById('password').value;
        const correctPassword = "21/8"; // حط الباسورد بتاعك هنا
        
        if (password === correctPassword) {
            window.location.href = "index2.html"; // الانتقال للصفحة التانية
        } else {
            alert("الباسورد غلط حاولي تاني يروحي");
        }
    }
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = ['❤️', '❤️', '❤️', '❤️', '❤️', '❤️'][Math.floor(Math.random() * 6)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 30 + 35) + 'px';
            heart.style.animationDuration = (Math.random() * 5 + 10) + 's';
            
            document.querySelector('.hearts-container').appendChild(heart);
            
            setTimeout(() => heart.remove(), 15000);
        }, 3000);
    </script>
